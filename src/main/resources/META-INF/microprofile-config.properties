# Jakarta NoSQL'in kullandığı MongoDB bağlantısı.
# ${...} değerleri ortam değişkenlerinden çözümlenir (bkz. .env.example);
# böylece repoda hiçbir kimlik bilgisi saklanmaz.
jnosql.document.database=${DB_NAME}
jnosql.mongodb.url=mongodb://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}?authSource=${DB_NAME}&directConnection=true
