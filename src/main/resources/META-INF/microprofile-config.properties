# MongoDB connection used by Jakarta NoSQL.
# ${...} values are resolved from environment variables (see .env.example),
# so no credentials are stored in the repository.
jnosql.document.database=${DB_NAME}
jnosql.mongodb.url=mongodb://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}?authSource=${DB_NAME}&directConnection=true
