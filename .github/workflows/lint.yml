# Checkstyle ve PMD ile statik analiz; herhangi bir ihlal job'ı başarısız yapar
name: lint

on:
  pull_request:
    branches: [dev, main]
    # "edited", PR'ın hedef branch'i değiştirildiğinde kontrolü yeniden çalıştırır
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run Checkstyle and PMD
        run: mvn -B checkstyle:check pmd:check
