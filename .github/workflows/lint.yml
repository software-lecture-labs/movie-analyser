# Static analysis with Checkstyle and PMD; any violation fails the job
name: lint

on:
  pull_request:
    branches: [dev, main]
    # "edited" re-runs the check when the target branch of a PR is changed
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run Checkstyle and PMD
        run: mvn -B checkstyle:check pmd:check
