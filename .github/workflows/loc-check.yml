# Pull request'te değişen dosyaların satır sınırlarını kontrol eder
name: loc-check

on:
  pull_request:
    branches: [dev, main]
    # "edited", PR'ın hedef branch'i değiştirildiğinde kontrolü yeniden çalıştırır
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  loc-check:
    name: loc-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Hedef branch ile karşılaştırma yapabilmek için tüm geçmiş gerekir
          fetch-depth: 0

      - name: Check line limits
        env:
          BASE_BRANCH: ${{ github.base_ref }}
        run: bash scripts/check-loc.sh "origin/$BASE_BRANCH"
