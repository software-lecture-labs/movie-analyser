# Geliştirme için yerel MongoDB. Değerler .env dosyasından gelir.
# MongoDB tek düğümlü bir replica set olarak çalışır; çünkü çok belgeli
# transaction'lar yalnızca replica set'lerde kullanılabilir.
services:
  mongodb:
    image: mongo:8.0
    container_name: movieanalyser-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${DB_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${DB_NAME}
      # Başlangıç betiği tarafından uygulama kullanıcısını oluşturmak için okunur
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    # Kimlik doğrulamalı bir replica set anahtar dosyası gerektirir; bu dosya
    # konteynerin içinde üretilir, böylece repoda gizli hiçbir şey saklanmaz.
    entrypoint:
      - bash
      - -c
      - |
        openssl rand -base64 756 > /etc/mongo-keyfile
        chmod 400 /etc/mongo-keyfile
        chown 999:999 /etc/mongo-keyfile
        exec docker-entrypoint.sh mongod --replSet rs0 --keyFile /etc/mongo-keyfile --bind_ip_all
    ports:
      # Yalnızca localhost'a bağlanır; böylece veritabanına yerel ağdan erişilemez
      - "127.0.0.1:${DB_PORT:-27017}:27017"
    volumes:
      - mongodb-data:/data/db
      - ./docker/mongo/init-user.js:/docker-entrypoint-initdb.d/init-user.js:ro
    healthcheck:
      # İlk çalıştırmada replica set'i başlatır, ardından durumunu bildirir
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet -u "$$MONGO_INITDB_ROOT_USERNAME" -p "$$MONGO_INITDB_ROOT_PASSWORD"
          --authenticationDatabase admin --eval
          "try { rs.status().ok } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'localhost:27017'}]}).ok }"
          | grep -q 1
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

volumes:
  mongodb-data:
